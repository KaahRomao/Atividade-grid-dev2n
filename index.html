<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/script.js" defer></script>
    <link rel="icon" type="image/png" href="./assets/imgs/whats.png">

    <title>Whatsapp Web</title>
</head>

<body class="grid-template">
    <nav>
        <div class="superior">
            <img src="./assets/icons/messages.svg" alt="" id="chats">
            <img src="./assets/icons/status.svg" alt="">
            <img src="./assets/icons/newsletter.svg" alt="">
            <img src="./assets/icons/community.svg" alt="">
        </div>
        <div class="superior">
            <img src="./assets/icons/settings.svg" alt="">
            <button id="botao-perfilFoto"><img src="./assets/imgs/pexels-ikowh-16622.jpg" alt=""></button>
        </div>
    </nav>
    <section class="chats">
        <div class="section-superior">
            <div class="titulo-settings">

                <p>WhatsApp</p>

                <div class="settings">
                    <img src="./assets/icons/new-chat.svg" alt="">
                    <img src="assets/icons/more-settings.svg" alt="">
                </div>
            </div>
            <div class="inputado">

                <input type="text" placeholder="Pesquisar ou começar uma nova conversa">
            </div>
            <div class="botoes">
                <p class="texto-botao active">Tudo</p>
                <p class="texto-botao">Não lidas</p>
                <p class="texto-botao">Favoritas</p>
                <p class="texto-botao">Grupos</p>
            </div>
        </div>
        <div class="section-inferior">
            <div class="suma">
            </div>
    </section>
    <section class="botao-perfilFoto hidden">
        <div class="perfil-header">
            <p>Perfil</p>
        </div>

        <div class="perfil-avatar-wrap">
            <div class="perfil-avatar"></div>
        </div>

        <div class="perfil-campo">
            <label>Nome</label>
            <p id="perfil-nome-ativo">Ricardo da Silva</p>
        </div>

        <div class="perfil-campo">
            <label>Recado</label>
            <div class="perfil-linha">
                <p>Disponível</p>
                <img src="./assets/icons/edit.svg" alt="">
            </div>
        </div>

        <div class="perfil-campo">
            <label>Telefone</label>
            <div class="perfil-linha">
                <div class="perfil-telefone">
                    <img src="./assets/icons/phone.svg" alt="">
                    <span id="perfil-telefone-ativo">+55 11 98787 6567</span>
                </div>
                <img src="./assets/icons/copy.svg" alt="">
            </div>
        </div>

        <div class="perfil-trocar">
            <p>Trocar de Perfil</p>
            <div class="perfil-lista">
                <div class="perfil-item" data-id="1">
                    <div class="perfil-mini-avatar"></div><span>Ricky</span>
                </div>
                <div class="perfil-item" data-id="2">
                    <div class="perfil-mini-avatar"></div><span>BeeR</span>
                </div>
                <div class="perfil-item" data-id="3">
                    <div class="perfil-mini-avatar"></div><span>Sand</span>
                </div>
                <div class="perfil-item" data-id="4">
                    <div class="perfil-mini-avatar"></div><span>Joe</span>
                </div>
            </div>
        </div>
    </section>
    <header class="chats">
        <div class="foto-nome">
            <img src="assets/imgs/pexels-ikowh-16622.jpg" alt="">
            <h2>Pyong Lee</h2>
        </div>
        <div class="config">
            <div class="juntinho">
                <img src="assets/icons/video-cam.svg" alt="">
                <img src="assets/icons/down-menu.svg" alt="">
            </div>
            <img src="assets/icons/more-settings.svg" alt="">
        </div>
    </header>
    <aside class="botao-perfilFoto hidden">
    </aside>
    <main class="chats">
        <div class="fundo-falso">
            <form class="mandar-message" id="form-enviar">
                <div class="plus">
                    <img src="./assets/icons/plus.svg" alt="">
                    <img src="./assets/icons/expressions.svg" alt="">
                </div>
                <input type="text" placeholder="Digite uma mensagem" id="input-mensagem">
                <button class="enviar-input"><img src="./assets/icons/send-message.png" alt="" class="send"></button>
            </form>
        </div>
    </main>

</body>

</html>
